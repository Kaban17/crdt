[package]
name = "crdt-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly-биндинги crdt-lab для интерактивной демонстрации (web/)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
crdt-lab = { path = ".." }
wasm-bindgen = "0.2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
